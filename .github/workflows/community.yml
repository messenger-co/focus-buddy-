name: Kiểm tra phòng học trực tuyến
on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'src/discussion/**'
      - '.github/workflows/community.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - run: npm run test:community:network
