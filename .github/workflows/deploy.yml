name: Triển khai GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Kiểm tra và biên dịch
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm thử
        run: npm test && npm run test:edge

      - name: Biên dịch trang tĩnh
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

      - name: Tải bản biên dịch lên
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Xuất bản trang
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
